<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="wingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" /> <!-- Violet -->
            <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" /> <!-- Cyan -->
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
            <feOffset dx="0" dy="10" result="offsetblur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    
    <g filter="url(#shadow)">
        <!-- Butterfly Wings (Abstract Geometric) -->
        <!-- Top Left Wing -->
        <path d="M256 256 C 200 100, 50 150, 80 250 C 110 350, 256 256, 256 256 Z" fill="url(#wingGradient)" />
        <!-- Bottom Left Wing -->
        <path d="M256 256 C 200 400, 100 450, 120 350 C 140 250, 256 256, 256 256 Z" fill="url(#wingGradient)" opacity="0.8" />
        
        <!-- Top Right Wing -->
        <path d="M256 256 C 312 100, 462 150, 432 250 C 402 350, 256 256, 256 256 Z" fill="url(#wingGradient)" />
        <!-- Bottom Right Wing -->
        <path d="M256 256 C 312 400, 412 450, 392 350 C 372 250, 256 256, 256 256 Z" fill="url(#wingGradient)" opacity="0.8" />
        
        <!-- Body -->
        <ellipse cx="256" cy="256" rx="12" ry="80" fill="#1F2937" />
        
        <!-- Antennae -->
        <path d="M250 190 Q 230 150, 210 140" stroke="#1F2937" stroke-width="6" fill="none" stroke-linecap="round" />
        <path d="M262 190 Q 282 150, 302 140" stroke="#1F2937" stroke-width="6" fill="none" stroke-linecap="round" />
    </g>
    
    <!-- Framework Name -->
    <text x="256" y="460" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#1F2937" text-anchor="middle" letter-spacing="4">KUPU</text>
    <text x="256" y="495" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle" letter-spacing="8">FRAMEWORK</text>
</svg>
