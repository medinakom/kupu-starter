<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces"
                xmlns:h="jakarta.faces.html">

    <ui:decorate template="/WEB-INF/components/core/base/table.xhtml">
        <ui:define name="columns">
            <p:column headerText="Id">
                <h:outputText value="#{data.id}" />
            </p:column>
            <p:column headerText="Name">
                <h:outputText value="#{data.name}" />
            </p:column>
            <p:column headerText="TariffCategory">
                <h:outputText value="#{data.tariffCategory}" />
            </p:column>
            <p:column headerText="Rt">
                <h:outputText value="#{data.rt}" />
            </p:column>
            <p:column headerText="Rw">
                <h:outputText value="#{data.rw}" />
            </p:column>
        </ui:define>
    </ui:decorate>

</ui:composition>
