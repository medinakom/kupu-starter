<ui:composition template="/WEB-INF/templates/editor-page.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="jakarta.faces.facelets" xmlns:f="jakarta.faces.core" xmlns:p="primefaces">

    <f:metadata>
        <ui:param name="viewPage" value="#{customerEditorPage}" />
        <ui:include src="/WEB-INF/components/core/base/meta/page.xhtml" />

        <ui:param name="primaryTitle" value="Editor Customer" />

        <ui:param name="notool" value="true" />
        <ui:param name="nofilter" value="true" />

        <f:viewParam name="entity" value="#{viewPage.entity}" converter="CustomerConverter" />

        <f:viewAction action="#{viewPage.load}" />
    </f:metadata>

    <ui:define name="content-header" />

    <ui:define name="form">
        <div class="grid w-full p-3">
            <div class="col-12 md:col-6 md:col-offset-3">
                <ui:decorate template="/WEB-INF/components/core/base/formlet.xhtml">
                    <ui:define name="fields">
                        <div class="form-field">
                            <p:outputLabel for="id" value="Id" />
                            <p:inputText id="id" value="#{viewPage.entity.id}" class="block w-full" />
                            <p:message for="id" />
                        </div>
                        <div class="form-field">
                            <p:outputLabel for="name" value="Name" />
                            <p:inputText id="name" value="#{viewPage.entity.name}" class="block w-full" />
                            <p:message for="name" />
                        </div>
                        <div class="form-field">
                            <p:outputLabel for="tariffCategory" value="TariffCategory" />
                            <p:inputText id="tariffCategory" value="#{viewPage.entity.tariffCategory}" class="block w-full" />
                            <p:message for="tariffCategory" />
                        </div>
                        <div class="form-field">
                            <p:outputLabel for="rt" value="Rt" />
                            <p:inputText id="rt" value="#{viewPage.entity.rt}" class="block w-full" />
                            <p:message for="rt" />
                        </div>
                        <div class="form-field">
                            <p:outputLabel for="rw" value="Rw" />
                            <p:inputText id="rw" value="#{viewPage.entity.rw}" class="block w-full" />
                            <p:message for="rw" />
                        </div>
                    </ui:define>
                </ui:decorate>
            </div>
        </div>
    </ui:define>

</ui:composition>
